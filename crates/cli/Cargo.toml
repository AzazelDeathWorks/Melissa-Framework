[package]
name = "melissa-cli"
version = "0.3.0-alpha.3"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "melissa"
path = "src/main.rs"

[dependencies]
melissa-verification = { path = "../verification" }
melissa-core-contracts = { path = "../core-contracts" }
melissa-local-store = { path = "../local-store" }
melissa-repository = { path = "../repository" }
melissa-code-quality = { path = "../code-quality" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
getrandom.workspace = true
melissa-model-gateway = { path = "../model-gateway" }
melissa-workflow = { path = "../workflow" }
melissa-recovery = { path = "../recovery" }
melissa-skill-context = { path = "../skill-context" }
melissa-build-test = { path = "../build-test" }
melissa-container-executor = { path = "../container-executor" }
melissa-web-development = { path = "../web-development" }
melissa-execution-broker = { path = "../execution-broker" }
tokio.workspace = true
zeroize.workspace = true
url.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
tempfile.workspace = true
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
toml = "=1.1.8"
reqwest.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
base64 = "=0.22.1"
sha2 = "=0.10.9"

[build-dependencies]
serde_json.workspace = true
